name: Deploy TanStack Start site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Build Project (Static Pre-render)
        run: NITRO_PRESET=static bun run build

      - name: Prepare Deployment Directory
        run: |
          mkdir -p public_deploy
          
          # 정적 빌드 결과물 수집
          if [ -d "./.output/public" ]; then
            cp -r ./.output/public/* ./public_deploy/
          elif [ -d "./dist" ]; then
            cp -r ./dist/* ./public_deploy/
          elif [ -d "./.output" ]; then
            cp -r ./.output/* ./public_deploy/
          fi

          # CNAME 및 404 라우팅 처리
          echo "aifind.kr" > ./public_deploy/CNAME
          if [ -f "./public_deploy/index.html" ]; then
            cp ./public_deploy/index.html ./public_deploy/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
