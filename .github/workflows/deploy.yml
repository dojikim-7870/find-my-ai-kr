name: Deploy TanStack Start site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Build Project
        run: bun run build

      - name: Locate and Prepare Static Files
        run: |
          mkdir -p public_deploy

          # index.html이 위치한 경로 자동 검색 후 복사
          INDEX_PATH=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "./public_deploy/*" | head -n 1)
          
          if [ -n "$INDEX_PATH" ]; then
            TARGET_DIR=$(dirname "$INDEX_PATH")
            echo "Found index.html in $TARGET_DIR"
            cp -r $TARGET_DIR/* ./public_deploy/
          else
            echo "index.html not found, copying fallback outputs"
            cp -r ./.output/* ./public_deploy/ 2>/dev/null || true
          fi

          # CNAME 및 SPA Routing (404 Fallback) 설정
          echo "aifind.kr" > ./public_deploy/CNAME
          if [ -f "./public_deploy/index.html" ]; then
            cp ./public_deploy/index.html ./public_deploy/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
